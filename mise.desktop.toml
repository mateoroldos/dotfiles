[bootstrap.packages]
"pacman:alacritty" = "latest"
"pacman:noctalia" = "latest"
"pacman:keyd" = "latest"
# IBM Plex Sans is herdr-app's UI face
"pacman:ttf-ibm-plex" = "latest"
# Lilex is IBM Plex Mono with programming ligatures, the terminal face
"pacman:ttf-lilex-nerd" = "latest"
"pacman:discord" = "latest"
"pacman:bitwarden" = "latest"
"pacman:vlc" = "latest"
"pacman:vlc-plugins-extra" = "latest"
"aur:spotify" = "latest"

[bootstrap.files."/etc/keyd/default.conf"]
source = "desktop/keyd/default.conf"
notify = ["keyd"]

# Only the laptop's built-in keyboard swaps alt and meta
[bootstrap.files."/etc/keyd/laptop.conf"]
source = "desktop/keyd/laptop.conf"
notify = ["keyd"]

[bootstrap.services.keyd]
state = "running"
enabled = true

# A hook, not a task: mise combines hooks across config files, so this adds to
# mise.toml's bootstrap task instead of replacing it. Installed once; the app updates itself.
[bootstrap.hooks.final]
run = "test -e ~/.local/share/herdr-app || curl -fsSL https://releases.herdr.dev/app/install.sh | sh"

[dotfile_groups.desktop]
root = "desktop/config"
target = "~/.config"
