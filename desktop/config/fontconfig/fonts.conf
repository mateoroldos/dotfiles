<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- herdr-app draws Lilex with a heavy face when the family has extra
       weights. Hiding them leaves Regular, Bold, Italic and Bold Italic. -->
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/TTF/LilexNerdFont*-Thin*</glob>
      <glob>/usr/share/fonts/TTF/LilexNerdFont*-ExtraLight*</glob>
      <glob>/usr/share/fonts/TTF/LilexNerdFont*-Medium*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
