# Unbind <C-b> as the prefix key
unbind C-b

# Bind <C-Space> as the prefix key
unbind C-Space
set -g prefix C-Space
bind Space send-prefix

# Mouse
set -g mouse on

# History
set -g history-limit 100000

# Colors
set -g default-terminal "tmux-256color"

# Window navigation
bind -n M-h previous-window
bind -n M-l next-window

# Resizing
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# Splits
bind | split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Reload
bind r source-file ~/.config/tmux/tmux.conf

# Escape
set -sg escape-time 0

# Windows
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Remove kill-pane confirmation
bind-key x kill-pane

# Sesh
bind -n M-j display-popup -E -w 40% -h 50% "sesh picker -i"

# Fixes shift enter problems
set -g xterm-keys on
set -as terminal-features ',*:extkeys'
set -s extended-keys always
set -s extended-keys-format csi-u

# Plugins
# TPM and plugins auto-install on first run into ~/.tmux/plugins/,
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'

# vi keys for copy mode
set-window-option -g mode-keys vi

# Melange theme
# background #292522 · foreground #ECE1D7 · muted #867462 · border #544F4A · accent #7F91B2

# Bar
set -g status-position top
set -g status-justify absolute-centre
set -g status 2
set -g status-format[1] "#[bg=default] "

set -g status-style "bg=default,fg=#ECE1D7"

set -g window-status-style "fg=#867462,bg=default"
set -g window-status-format " #W "
set -g window-status-current-style "fg=#292522,bg=#7F91B2"
set -g window-status-current-format " #W "

set -g pane-border-style "fg=#544F4A"
set -g pane-active-border-style "fg=#7F91B2"

set -g message-style "fg=#ECE1D7,bg=#292522"
set -g message-command-style "fg=#ECE1D7,bg=#292522"

set-window-option -g mode-style "fg=#292522,bg=#E49B5D"

set -g automatic-rename off
set-window-option -g automatic-rename off
