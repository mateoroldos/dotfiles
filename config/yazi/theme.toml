# mellifluous theme for Yazi · dark
# https://github.com/ramojus/mellifluous.nvim
#
# The file preview highlights code through syntect, which reads a tmTheme
# rather than any key below, so previews keep yazi's default syntax colors.

[mgr]
cwd = { fg = "#cbaa88" }
find_keyword = { fg = "#bfaf8e", bold = true }
find_position = { fg = "#cbaa88", italic = true }
symlink_target = { fg = "#aeaeae", italic = true }
marker_copied = { fg = "#939374", bg = "#939374" }
marker_cut = { fg = "#be7c7d", bg = "#be7c7d" }
marker_marked = { fg = "#938ca8", bg = "#938ca8" }
marker_selected = { fg = "#cbaa88", bg = "#cbaa88" }
count_copied = { fg = "#141414", bg = "#939374" }
count_cut = { fg = "#141414", bg = "#be7c7d" }
count_selected = { fg = "#141414", bg = "#cbaa88" }
border_style = { fg = "#323232" }

[tabs]
active = { fg = "#141414", bg = "#cbaa88", bold = true }
inactive = { fg = "#aeaeae", bg = "#1e1e1e" }

[mode]
normal_main = { fg = "#141414", bg = "#cbaa88", bold = true }
normal_alt = { fg = "#cbaa88", bg = "#282828" }
select_main = { fg = "#141414", bg = "#938ca8", bold = true }
select_alt = { fg = "#938ca8", bg = "#282828" }
unset_main = { fg = "#141414", bg = "#aa8a69", bold = true }
unset_alt = { fg = "#aa8a69", bg = "#282828" }

[indicator]
parent = { bg = "#1e1e1e" }
current = { bg = "#1e1e1e" }
preview = { bg = "#1e1e1e" }

[status]
overall = { fg = "#dadada", bg = "#282828" }
perm_sep = { fg = "#5b5b5b" }
perm_type = { fg = "#a8a1be" }
perm_read = { fg = "#bfaf8e" }
perm_write = { fg = "#be7c7d" }
perm_exec = { fg = "#b3b393" }
progress_label = { fg = "#dadada", bold = true }
progress_normal = { fg = "#cbaa88", bg = "#282828" }
progress_error = { fg = "#141414", bg = "#be7c7d" }

[which]
mask = { bg = "#0f0f0f" }
cand = { fg = "#cbaa88" }
rest = { fg = "#848484" }
desc = { fg = "#aeaeae" }
separator_style = { fg = "#323232" }

[confirm]
border = { fg = "#323232" }
title = { fg = "#cbaa88" }
body = { fg = "#dadada" }
list = { fg = "#aeaeae" }
btn_yes = { fg = "#141414", bg = "#cbaa88", bold = true }
btn_no = { fg = "#aeaeae" }

[spot]
border = { fg = "#323232" }
title = { fg = "#cbaa88" }
tbl_col = { fg = "#a8a1be" }
tbl_cell = { fg = "#141414", bg = "#cbaa88" }

[notify]
title_info = { fg = "#938ca8" }
title_warn = { fg = "#aa8a69" }
title_error = { fg = "#be7c7d" }

[pick]
border = { fg = "#323232" }
active = { fg = "#cbaa88", bold = true }
inactive = { fg = "#aeaeae" }

[input]
border = { fg = "#323232" }
title = { fg = "#cbaa88" }
value = { fg = "#dadada" }
selected = { bg = "#2d2d2d" }

[cmp]
border = { fg = "#323232" }
active = { fg = "#141414", bg = "#cbaa88" }
inactive = { fg = "#aeaeae" }

[tasks]
border = { fg = "#323232" }
title = { fg = "#cbaa88" }
hovered = { fg = "#cbaa88", bold = true }

[help]
on = { fg = "#cbaa88" }
run = { fg = "#bfaf8e" }
desc = { fg = "#aeaeae" }
hovered = { bg = "#1e1e1e", bold = true }
footer = { fg = "#aeaeae", bg = "#1e1e1e" }

[filetype]
rules = [
  # Image
  { mime = "image/*", fg = "#bfaf8e" },
  # Media
  { mime = "{audio,video}/*", fg = "#b99bb5" },
  # Archive
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#d59192" },
  # Document
  { mime = "application/{pdf,doc,rtf}", fg = "#a8a1be" },
  # Virtual file system
  { mime = "vfs/{absent,stale}", fg = "#848484" },
  # Broken link, and a file yazi could not read
  { url = "*", is = "orphan", bg = "#be7c7d" },
  { url = "*", is = "dummy", bg = "#be7c7d" },
  { url = "*/", is = "dummy", bg = "#be7c7d" },
  # Executable
  { url = "*", is = "exec", fg = "#b3b393" },
  # Directory, last so the globs above win
  { url = "*/", fg = "#cbaa88" }
]
