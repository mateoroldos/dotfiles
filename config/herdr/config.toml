onboarding = false

[theme]
name = "terminal"   # neutral base; every token below is overridden by mellifluous
auto_switch = false

[theme.custom]
accent      = "#cbaa88"
panel_bg    = "#141414"
sidebar_bg  = "#141414"
active_row_bg = "#2d2d2d"
selection_bg  = "#3b3b3b"
surface0    = "#242424"
surface1    = "#2d2d2d"
surface_dim = "#141414"
overlay0    = "#5b5b5b"
overlay1    = "#848484"
text        = "#dadada"
subtext0    = "#aeaeae"
mauve       = "#b99bb5"
green       = "#b3b393"
yellow      = "#bfaf8e"
red         = "#d59192"
blue        = "#a8a1be"
teal        = "#a8a1be"
peach       = "#cbaa88"

[keys]
prefix = "ctrl+space"

goto = ["alt+g"]
workspace_picker = "prefix+alt+w"
open_notification_target = "prefix+alt+o"

previous_workspace = "alt+k"
next_workspace = "alt+j"

previous_agent = "alt+shift+k"
next_agent = "alt+shift+j"

previous_tab = "alt+h"
next_tab = "alt+l"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "/home/runguinator/dotfiles/config/television/scripts/jj-ws new tab"
description = "new jj workspace (tab)"
width = "60%"
height = "20%"

[[keys.command]]
key = "prefix+shift+f"
type = "popup"
command = "/home/runguinator/dotfiles/config/television/scripts/jj-ws new workspace"
description = "new jj workspace (herdr workspace)"
width = "60%"
height = "20%"

[[keys.command]]
key = "prefix+p"
type = "popup"
command = "/home/runguinator/dotfiles/config/television/scripts/jj-ws open"
description = "open a repo or fork"
width = "85%"
height = "70%"

[[keys.command]]
key = "prefix+d"
type = "popup"
command = "/home/runguinator/dotfiles/config/television/scripts/jj-ws rm"
description = "delete jj workspace"
width = "60%"
height = "50%"

# Show GitHub links instead of opening them: herdr may run on a headless devbox,
# and the terminal opens a clicked link on the machine you sit at.
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "cd \"$HERDR_ACTIVE_PANE_CWD\" && gh browse -n; read -r _"
description = "show this repo's GitHub link"
width = "60%"
height = 5

[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "cd \"$HERDR_ACTIVE_PANE_CWD\" && tv prs"
description = "this repo's open pull requests"
width = "95%"
height = "90%"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "dotfiles.tools.jjui-split"
description = "jjui in a split pane"

[[keys.command]]
key = "prefix+shift+u"
type = "plugin_action"
command = "dotfiles.tools.jjui-tab"
description = "jjui in a new tab"

[[keys.command]]
key = "prefix+i"
type = "plugin_action"
command = "dotfiles.tools.nvim-split"
description = "neovim in a split pane"

[[keys.command]]
key = "prefix+shift+i"
type = "plugin_action"
command = "dotfiles.tools.nvim-tab"
description = "neovim in a new tab"

[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "dotfiles.tools.yazi-split"
description = "yazi in a split pane"

[[keys.command]]
key = "prefix+shift+y"
type = "plugin_action"
command = "dotfiles.tools.yazi-tab"
description = "yazi in a new tab"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "jjui"
description = "run jjui"
width = "90%"
height = "90%"

# Plannotator

# Terminal annotations
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "annotate.copy-archive"
description = "copy annotations as context and archive them"

[[keys.command]]
key = "prefix+ctrl+v"
type = "plugin_action"
command = "annotate.paste-archive"
description = "paste annotations into the agent's prompt and archive them"

[[keys.command]]
key = "prefix+ctrl+s"
type = "plugin_action"
command = "annotate.send-archive"
description = "send annotations to the agent and archive them"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

# Document review (plannotator-tui)
[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"

[[keys.command]]
key = "prefix+ctrl+o"
type = "plugin_action"
command = "annotate.last-newest"
description = "review the agent's newest reply"
