id = "dotfiles.tools"
name = "tools"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Open terminal tools in a split pane or a new tab."
platforms = ["linux", "macos"]

[[panes]]
id = "jjui"
title = "jjui"
command = ["jjui"]

[[actions]]
id = "jjui-split"
title = "jjui in a split pane"
contexts = ["workspace"]
command = ["./open", "jjui", "split"]

[[actions]]
id = "jjui-tab"
title = "jjui in a new tab"
contexts = ["workspace"]
command = ["./open", "jjui", "tab"]

