# Repos zoxide knows, each followed by its jj forks. herdr-app opens the pick through `jj-ws open`.

[metadata]
name = "projects"
description = "Repos and their jj forks"
requirements = ["jj", "zoxide"]

[source]
command = [
  { name = "All", run = "~/dotfiles/config/television/scripts/jj-ws rows" },
  { name = "Repos", run = "~/dotfiles/config/television/scripts/jj-ws rows repo" },
  { name = "Forks", run = "~/dotfiles/config/television/scripts/jj-ws rows fork" },
]
ansi = true
no_sort = true
output = "{strip_ansi|split: :-1}"

[preview]
command = "~/dotfiles/config/television/scripts/jj-ws preview '{strip_ansi|split: :-1}'"

[keybindings]
ctrl-f = "actions:fork"
ctrl-d = ["actions:delete", "reload_source"]

[actions.fork]
description = "Fork the selected repo from trunk"
command = "~/dotfiles/config/television/scripts/jj-ws fork '{strip_ansi|split: :-1}'"
mode = "execute"

[actions.delete]
description = "Delete the selected fork"
command = "~/dotfiles/config/television/scripts/jj-ws rm '{strip_ansi|split: :-1}'"
mode = "fork"
