[user]
name = "Mateo Roldos"
email = "mateoroldos19@gmail.com"

[ui]
diff-editor = ["nvim", "-c", "DiffEditor $left $right $output"]
diff-instructions = false

# Minimal `jj log`: override the fragment aliases the builtin template calls,
# rather than replacing templates.log — so future jj upgrades still flow through.
[colors]
# `prompt_dirty` is our own label, emitted by fish_jj_prompt for a non-empty @.
"prompt_dirty" = "yellow"

[template-aliases]
'format_short_signature(signature)' = 'signature.name()'  # name, not email  ('""' = hide author)
'format_timestamp(timestamp)'       = '""'                # no date/time
'format_short_commit_id(id)'        = '""'                # no commit hash (change id stays)

[aliases]
# Fetch, then move every local stack onto main; a change main already holds (a merged
# PR's local copy) becomes empty on the way and is dropped. As in Chromium's
# tools/jj/sync.py; simplify-parents tidies the odd shapes --skip-emptied can leave on merges.
sync = ["util", "exec", "--", "bash", "-c", """
set -e
jj git fetch
jj rebase -b 'mutable()' -o 'trunk()' --skip-emptied
jj simplify-parents -r 'mutable()'
jj log -r 'mutable() & ~empty() & ~::trunk()'
""", ""]
